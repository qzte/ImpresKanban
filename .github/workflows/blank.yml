# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Falha se a versão da app divergir entre version.js (fonte única) e
      # os sítios que não podem ser derivados automaticamente (cabeçalho
      # CSS e changelog em index.html) — ver v4.15.1
      - name: Check version sync
        run: node scripts/check-version-sync.js

      # Sem isto, um erro de sintaxe no <script> inline de index.html só
      # era descoberto ao abrir a app no browser — ver v4.15.3
      - name: Check inline <script> syntax (index.html)
        run: node scripts/check-js-syntax.js

      - name: Check syntax (sw.js, version.js, scripts/)
        run: |
          node --check sw.js
          node --check version.js
          find scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      # Testes unitários das funções puras extraídas de index.html — ver
      # test/pure-functions.test.js (isValorAtivo, calcularIntervaloDataRapido,
      # obterChaveSemana, validarDuplicados, normalizarTextoRFID)
      - name: Run unit tests
        run: node --test
